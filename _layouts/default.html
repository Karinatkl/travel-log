<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}｜{% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.css %}<link rel="stylesheet" href="{{ page.css | relative_url }}">{% endif %}
  {% if page.leaflet %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">{% endif %}
</head>
<body>
  <header class="site-head">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">總表</a>
      <a href="{{ '/calendar/' | relative_url }}">行事曆</a>
      <a href="{{ '/map/' | relative_url }}">地圖</a>
      <a href="https://github.com/{{ site.github_repo | default: 'Karinatkl/travel-log' }}" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-foot">
    <span>© {{ site.author }} · Travel Log</span>
    <span>最後更新 {{ site.time | date: "%Y-%m-%d" }}</span>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
