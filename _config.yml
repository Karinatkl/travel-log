title: Travel Log
description: Karina 嘅旅行檔案 — 行程總表同逐個行程嘅詳情
author: Karina
lang: zh-HK
timezone: Asia/Hong_Kong
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
exclude:
  - README.md
  - scripts
  - templates
  - Gemfile
  - Gemfile.lock
  - "*.mp4"
  - "*.mov"

defaults:
  - scope:
      path: "trips"
    values:
      layout: trip
