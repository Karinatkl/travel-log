---
layout: default
title: 世界地圖
description: 將所有行程畫喺世界地圖 — 邊個國家、邊個城市去過，一睇就知。
permalink: /map/
leaflet: true
---

<style>
  #worldmap {
    height: 72vh; min-height: 420px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface);
  }
  .map-legend { font-size: 12.5px; color: var(--dim); margin: 10px 0 0; }
  .leaflet-popup-content { font-family: inherit; font-size: 13px; line-height: 1.6; }
  .map-legend .lg { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; }
  .map-legend .lg i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .tl-pin { background: transparent; border: 0; }
  .leaflet-popup-content a { color: var(--accent); font-weight: 600; }
</style>

<section class="page-head">
  <h1>去過邊</h1>
  <p class="sub">所有行程嘅位置。撳個點就見行程名同日期，可以直接跳去詳情頁。</p>
</section>

<div id="worldmap"></div>
<p class="map-legend">
  <span class="lg"><i style="background:#2563eb"></i>藍 pin＝同行（有人一齊去）</span>
  <span class="lg"><i style="background:#7c3aed"></i>紫 pin＝自己去</span>
  <span class="lg dim">底圖 © OpenStreetMap 貢獻者</span>
</p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var TRIPS = [
  {%- assign first = true -%}
  {%- for p in site.pages -%}
    {%- if p.layout == 'trip' and p.lat and p.lng -%}
      {%- unless first %},{% endunless -%}
      {
        "lat": {{ p.lat }},
        "lng": {{ p.lng }},
        "t": {{ p.title | jsonify }},
        "u": {{ p.url | relative_url | jsonify }},
        "s": {{ p.status | default: "" | jsonify }},
        "d": {{ p.start_date | default: "" | jsonify }},
        "e": {{ p.end_date | default: "" | jsonify }},
        "so": {{ p.solo | default: false }},
        "pts": [
          {%- assign f2 = true -%}
          {%- for pt in p.points -%}
            {%- unless f2 %},{% endunless -%}
            { "n": {{ pt.name | jsonify }}, "la": {{ pt.lat }}, "lo": {{ pt.lng }}, "so": {{ pt.solo | default: false }} }
            {%- assign f2 = false -%}
          {%- endfor -%}
        ]
      }
      {%- assign first = false -%}
    {%- endif -%}
  {%- endfor -%}
  ];

  var map = L.map("worldmap", { scrollWheelZoom: true, worldCopyJump: true });

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  if (!TRIPS.length) {
    map.setView([22.3, 114.2], 4);
  } else {
    var bounds = [];
    var BLUE = "#2563eb", PURPLE = "#7c3aed";

    function pinFor(solo) {
      var c = solo ? PURPLE : BLUE;
      return L.divIcon({
        className: "tl-pin",
        html: '<svg width="24" height="34" viewBox="0 0 24 34">' +
              '<path d="M12 33C12 33 23 18.5 23 12A11 11 0 1 0 1 12C1 18.5 12 33 12 33Z" ' +
              'fill="' + c + '" stroke="#fff" stroke-width="2"/>' +
              '<circle cx="12" cy="12" r="4" fill="#fff"/></svg>',
        iconSize: [24, 34], iconAnchor: [12, 33], popupAnchor: [0, -30]
      });
    }

    function popup(t, name) {
      return '<strong>' + (name ? name + '｜' : '') + t.t + '</strong><br>' +
        (t.d ? t.d + (t.e && t.e !== t.d ? " – " + t.e : "") + '<br>' : "") +
        (t.s ? '<span style="color:#918a80">' + t.s + '</span><br>' : "") +
        '<a href="' + t.u + '">睇行程 →</a>';
    }

    TRIPS.forEach(function (t) {
      // 有 points 就每個基地一個點，冇就用單一 lat/lng
      if (t.pts && t.pts.length) {
        t.pts.forEach(function (pt) {
          L.marker([pt.la, pt.lo], { icon: pinFor(pt.so) }).addTo(map).bindPopup(popup(t, pt.n));
          bounds.push([pt.la, pt.lo]);
        });
      } else {
        L.marker([t.lat, t.lng], { icon: pinFor(t.so) }).addTo(map).bindPopup(popup(t, ""));
        bounds.push([t.lat, t.lng]);
      }
    });
    if (bounds.length === 1) {
      map.setView(bounds[0], 12);
    } else {
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  }
</script>
