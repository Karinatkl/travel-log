---
layout: default
title: 世界地圖
description: 平面地圖 —— 睇晒去過邊個國家、邊個城市。
permalink: /map/
leaflet: true
---

<style>
  #worldmap {
    height: 74vh; min-height: 460px;
    border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; background: var(--surface);
  }

  .map-legend { font-size: 12.5px; color: var(--dim); margin: 10px 0 0; }
  .map-legend .lg { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; }
  .map-legend .lg i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }

  .leaflet-popup-content { font-family: inherit; font-size: 13px; line-height: 1.6; }
  .leaflet-popup-content a { color: var(--accent); font-weight: 600; }
  .tl-pin { background: transparent; border: 0; }
</style>

<section class="page-head">
  <h1>去過邊</h1>
  <p class="sub">平面地圖 —— 拉動平移、碌落嚟放大縮細。每個點對應一個行程，撳個點就跳去詳情頁。</p>
</section>

<div id="worldmap"></div>

<p class="map-legend">
  <span class="lg"><i style="background:#2563eb"></i>藍＝同行（有人一齊去）</span>
  <span class="lg"><i style="background:#7c3aed"></i>紫＝自己去</span>
  <span class="lg dim">地圖圖資 © OpenStreetMap</span>
</p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  var TRIPS = [
  {%- assign first = true -%}
  {%- for p in site.pages -%}
    {%- if p.layout == 'trip' and p.lat and p.lng -%}
      {%- unless first %},{% endunless -%}
      {
        "lat": {{ p.lat }},
        "lng": {{ p.lng }},
        "t": {{ p.title | jsonify }},
        "u": {{ p.url | relative_url | jsonify }},
        "s": {{ p.status | default: "" | jsonify }},
        "d": {{ p.start_date | default: "" | jsonify }},
        "e": {{ p.end_date | default: "" | jsonify }},
        "so": {{ p.solo | default: false }},
        "pts": [
          {%- assign f2 = true -%}
          {%- for pt in p.points -%}
            {%- unless f2 %},{% endunless -%}
            { "n": {{ pt.name | jsonify }}, "la": {{ pt.lat }}, "lo": {{ pt.lng }}, "so": {{ pt.solo | default: false }} }
            {%- assign f2 = false -%}
          {%- endfor -%}
        ]
      }
      {%- assign first = false -%}
    {%- endif -%}
  {%- endfor -%}
  {%- assign covered = site.pages | where: "layout", "trip" | map: "url" -%}
  {%- for t in site.data.trips -%}
    {%- assign g = site.data.geo[t.trip_id] -%}
    {%- assign turl = '/trips/' | append: t.trip_id | append: '/' -%}
    {%- if g -%}
    {%- unless covered contains turl -%}
      {%- unless first %},{% endunless -%}
      {
        "lat": {{ g.lat }},
        "lng": {{ g.lng }},
        "t": {{ t.title_zh | jsonify }},
        "u": "",
        "s": {{ t.status | default: "" | jsonify }},
        "d": {{ t.start_date | default: "" | jsonify }},
        "e": {{ t.end_date | default: "" | jsonify }},
        "so": false,
        "pts": []
      }
      {%- assign first = false -%}
    {%- endunless -%}
    {%- endif -%}
  {%- endfor -%}
  ];

  var BLUE = "#2563eb", PURPLE = "#7c3aed";

  // 把每個行程攤平成 pin 清單
  var PINS = [];
  TRIPS.forEach(function (t) {
    var dateStr = t.d + (t.e && t.e !== t.d ? " – " + t.e : "");
    if (t.pts && t.pts.length) {
      t.pts.forEach(function (pt) {
        PINS.push({ la: pt.la, lo: pt.lo, n: pt.n, t: t.t, u: t.u, d: dateStr, so: pt.so });
      });
    } else {
      PINS.push({ la: t.lat, lo: t.lng, n: "", t: t.t, u: t.u, d: dateStr, so: t.so });
    }
  });

  var map2d = L.map("worldmap", { scrollWheelZoom: true, worldCopyJump: true });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map2d);

  function pinFor(solo) {
    var c = solo ? PURPLE : BLUE;
    return L.divIcon({
      className: "tl-pin",
      html: '<svg width="26" height="37" viewBox="0 0 24 34">' +
            '<path d="M12 33C12 33 23 18.5 23 12A11 11 0 1 0 1 12C1 18.5 12 33 12 33Z" ' +
            'fill="' + c + '" stroke="#fff" stroke-width="2"/>' +
            '<circle cx="12" cy="12" r="4" fill="#fff"/></svg>',
      iconSize: [26, 37], iconAnchor: [13, 36], popupAnchor: [0, -32]
    });
  }

  var bounds = [];
  PINS.forEach(function (p) {
    L.marker([p.la, p.lo], { icon: pinFor(p.so) }).addTo(map2d).bindPopup(
      "<strong>" + (p.n ? p.n + "｜" : "") + p.t + "</strong><br>" + p.d + "<br>" +
      (p.u ? '<a href="' + p.u + '">睇行程 →</a>' : '<span style="color:#8a8377">詳情待補</span>')
    );
    bounds.push([p.la, p.lo]);
  });
  if (bounds.length === 1) map2d.setView(bounds[0], 11);
  else if (bounds.length) map2d.fitBounds(bounds, { padding: [48, 48] });
  else map2d.setView([20, 110], 3);

  setTimeout(function () { map2d.invalidateSize(); }, 200);
</script>
