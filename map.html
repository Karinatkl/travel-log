---
layout: default
title: 世界地圖
description: 3D 地球 —— 睇晒去過邊個國家、邊個城市。
permalink: /map/
leaflet: true
---

<style>
  .map-shell { position: relative; }
  #globe3d, #worldmap {
    height: 72vh; min-height: 440px;
    border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; background: #0b1020;
  }
  #worldmap { display: none; background: var(--surface); }

  .map-tabs { display: inline-flex; gap: 6px; margin: 0 0 12px; }
  .map-tabs button {
    font: inherit; font-size: 13px; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px;
  }
  .map-tabs button[aria-pressed="true"] {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }

  .map-legend { font-size: 12.5px; color: var(--dim); margin: 10px 0 0; }
  .map-legend .lg { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; }
  .map-legend .lg i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }

  .leaflet-popup-content { font-family: inherit; font-size: 13px; line-height: 1.6; }
  .leaflet-popup-content a { color: var(--accent); font-weight: 600; }
  .tl-pin { background: transparent; border: 0; }

  .globe-label {
    font-family: inherit; font-size: 12.5px; line-height: 1.5;
    background: rgba(255,255,255,.96); color: #2b2a27;
    padding: 8px 11px; border-radius: 8px; max-width: 240px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  .globe-label b { font-weight: 700; }
  .globe-label .dim2 { color: #8a8377; }
  .globe-loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9aa4b8; font-size: 13px; pointer-events: none;
  }
</style>

<section class="page-head">
  <h1>去過邊</h1>
  <p class="sub">3D 地球 —— 拖住轉、碌落嚟放大縮細。每個點對應一個行程，撳個點就跳去詳情頁。</p>
</section>

<div class="map-tabs">
  <button id="tab3d" aria-pressed="true">🌍 3D 地球</button>
  <button id="tab2d" aria-pressed="false">🗺 平面地圖</button>
</div>

<div class="map-shell">
  <div id="globe3d"></div>
  <div id="worldmap"></div>
  <p class="globe-loading" id="globeLoading">地球載入中…</p>
</div>

<p class="map-legend">
  <span class="lg"><i style="background:#2563eb"></i>藍＝同行（有人一齊去）</span>
  <span class="lg"><i style="background:#7c3aed"></i>紫＝自己去</span>
  <span class="lg dim">地球貼圖 NASA Blue Marble · 平面圖 © OpenStreetMap</span>
</p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/globe.gl"></script>
<script>
  var TRIPS = [
  {%- assign first = true -%}
  {%- for p in site.pages -%}
    {%- if p.layout == 'trip' and p.lat and p.lng -%}
      {%- unless first %},{% endunless -%}
      {
        "lat": {{ p.lat }},
        "lng": {{ p.lng }},
        "t": {{ p.title | jsonify }},
        "u": {{ p.url | relative_url | jsonify }},
        "s": {{ p.status | default: "" | jsonify }},
        "d": {{ p.start_date | default: "" | jsonify }},
        "e": {{ p.end_date | default: "" | jsonify }},
        "so": {{ p.solo | default: false }},
        "pts": [
          {%- assign f2 = true -%}
          {%- for pt in p.points -%}
            {%- unless f2 %},{% endunless -%}
            { "n": {{ pt.name | jsonify }}, "la": {{ pt.lat }}, "lo": {{ pt.lng }}, "so": {{ pt.solo | default: false }} }
            {%- assign f2 = false -%}
          {%- endfor -%}
        ]
      }
      {%- assign first = false -%}
    {%- endif -%}
  {%- endfor -%}
  {%- assign covered = site.pages | where: "layout", "trip" | map: "url" -%}
  {%- for t in site.data.trips -%}
    {%- assign g = site.data.geo[t.trip_id] -%}
    {%- assign turl = '/trips/' | append: t.trip_id | append: '/' -%}
    {%- if g -%}
    {%- unless covered contains turl -%}
      {%- unless first %},{% endunless -%}
      {
        "lat": {{ g.lat }},
        "lng": {{ g.lng }},
        "t": {{ t.title_zh | jsonify }},
        "u": "",
        "s": {{ t.status | default: "" | jsonify }},
        "d": {{ t.start_date | default: "" | jsonify }},
        "e": {{ t.end_date | default: "" | jsonify }},
        "so": false,
        "pts": []
      }
      {%- assign first = false -%}
    {%- endunless -%}
    {%- endif -%}
  {%- endfor -%}
  ];

  var BLUE = "#2563eb", PURPLE = "#7c3aed";

  // 把每個行程攤平成 pin 清單
  var PINS = [];
  TRIPS.forEach(function (t) {
    var dateStr = t.d + (t.e && t.e !== t.d ? " – " + t.e : "");
    if (t.pts && t.pts.length) {
      t.pts.forEach(function (pt) {
        PINS.push({ la: pt.la, lo: pt.lo, n: pt.n, t: t.t, u: t.u, d: dateStr, so: pt.so });
      });
    } else {
      PINS.push({ la: t.lat, lo: t.lng, n: "", t: t.t, u: t.u, d: dateStr, so: t.so });
    }
  });

  // ───────── 2D 平面（Leaflet，lazy） ─────────
  var map2d = null;
  function init2D() {
    if (map2d) { map2d.invalidateSize(); return; }
    map2d = L.map("worldmap", { scrollWheelZoom: true, worldCopyJump: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map2d);

    function pinFor(solo) {
      var c = solo ? PURPLE : BLUE;
      return L.divIcon({
        className: "tl-pin",
        html: '<svg width="24" height="34" viewBox="0 0 24 34">' +
              '<path d="M12 33C12 33 23 18.5 23 12A11 11 0 1 0 1 12C1 18.5 12 33 12 33Z" ' +
              'fill="' + c + '" stroke="#fff" stroke-width="2"/>' +
              '<circle cx="12" cy="12" r="4" fill="#fff"/></svg>',
        iconSize: [24, 34], iconAnchor: [12, 33], popupAnchor: [0, -30]
      });
    }

    var bounds = [];
    PINS.forEach(function (p) {
      L.marker([p.la, p.lo], { icon: pinFor(p.so) }).addTo(map2d).bindPopup(
        "<strong>" + (p.n ? p.n + "｜" : "") + p.t + "</strong><br>" + p.d + "<br>" +
        (p.u ? '<a href="' + p.u + '">睇行程 →</a>' : '<span style="color:#8a8377">詳情待補</span>')
      );
      bounds.push([p.la, p.lo]);
    });
    if (bounds.length === 1) map2d.setView(bounds[0], 11);
    else if (bounds.length) map2d.fitBounds(bounds, { padding: [40, 40] });
    else map2d.setView([20, 110], 3);
  }

  // ───────── 3D 地球（globe.gl） ─────────
  var globe = null;
  function init3D() {
    if (globe) return true;
    if (typeof Globe === "undefined") return false;
    try {
      globe = Globe()(document.getElementById("globe3d"))
        .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg")
        .bumpImageUrl("https://unpkg.com/three-globe/example/img/earth-topology.png")
        .backgroundColor("#0b1020")
        .pointsData(PINS)
        .pointLat("la").pointLng("lo")
        .pointColor(function (p) { return p.so ? PURPLE : BLUE; })
        .pointAltitude(0.025)
        .pointRadius(0.55)
        .pointLabel(function (p) {
          return '<div class="globe-label"><b>' + (p.n ? p.n + "｜" : "") + p.t + '</b><br>' +
                 '<span class="dim2">' + p.d + '</span><br>' +
                 (p.u ? '<a href="' + p.u + '">睇行程 →</a>' : '<span class="dim2">詳情待補</span>') + '</div>';
        })
        .onPointClick(function (p) { if (p.u) window.location.href = p.u; });

      globe.pointOfView({ lat: 10, lng: 105, altitude: 2.4 }, 0);

      // 自動旋轉（一拖就停）
      var ctl = globe.controls();
      ctl.autoRotate = true;
      ctl.autoRotateSpeed = 0.35;
      ctl.enableDamping = true;
      ctl.dampingFactor = 0.15;
      ctl.minDistance = 105;
      ctl.maxDistance = 600;
      document.getElementById("globe3d").addEventListener("pointerdown", function () { ctl.autoRotate = false; });

      function resize() {
        var el = document.getElementById("globe3d");
        if (!el) return;
        globe.width(el.clientWidth);
        globe.height(el.clientHeight);
      }
      resize();
      window.addEventListener("resize", resize);
      document.getElementById("globeLoading").hidden = true;
      return true;
    } catch (e) {
      globe = null;
      return false;
    }
  }

  // ───────── 切換 ─────────
  var tab3d = document.getElementById("tab3d");
  var tab2d = document.getElementById("tab2d");
  var gEl = document.getElementById("globe3d");
  var mEl = document.getElementById("worldmap");

  function show3D() {
    if (!init3D()) { show2D(); return; }
    gEl.style.display = "block"; mEl.style.display = "none";
    tab3d.setAttribute("aria-pressed", "true"); tab2d.setAttribute("aria-pressed", "false");
  }
  function show2D() {
    gEl.style.display = "none"; mEl.style.display = "block";
    tab3d.setAttribute("aria-pressed", "false"); tab2d.setAttribute("aria-pressed", "true");
    init2D();
  }
  tab3d.addEventListener("click", show3D);
  tab2d.addEventListener("click", show2D);

  show3D();
</script>
